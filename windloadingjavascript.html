function setData(divId){
    var htmlData="";
    var rHeight=parseInt(document.getElementById('rHeight').value);
    var expCat=document.getElementById('expCat').options[document.getElementById('expCat').options.selectedIndex].text;
    var windSpd=parseInt(document.getElementById('windSpd').value);
    var eArea=10;
    var iFactor=parseFloat(document.getElementById('iFactor').value);
    var h=0;
    var wsf=0;
    var p30Cen=0;
    var p30Corn=0;
    var pnetcen=0;
    var pnetcorn=0;
    htmlData+="<p><b>Exposure Category = </b><em> "+expCat+"</em></p>";
    if(!isNum(windSpd)) windSpd = 80; 
    htmlData+="<p><b>Wind Speed = </b><em> "+windSpd+" mph</em></p>";
    if(!isNum(rHeight)) rHeight = 50; 
    htmlData+="<p><b>Average Roof Height = </b><em> "+rHeight+" ft.</em></p>";
    if(!isNum(iFactor)) iFactor = 1.15; 
    htmlData+="<p><b>Importance Factor = </b><em> "+iFactor+"</em></p>";     
    var pos=arIndexOf(expCat,exposures);
    if( rHeight <= 60 ){ // use UBI_03 data
	    h=table1609[rHeight][pos];
        htmlData+="<p><b>Height Factor = </b><em> "+h+"</em>";	    
        if(isNum(windSpd)){
                wsf=roundTo(Math.pow(windSpd,2)/Math.pow(90,2),3);
                htmlData+="<p><b>Wind Speed Factor = </b><em > "+wsf+"</em></p><br />";                  
                if(isNum(eArea)){
                   var pos=findGreatest(eArea,table1609P,0);   
                   p30Cen=roundTo(table1609P[pos][2]*wsf,3);
                   p30Corn=roundTo(table1609P[pos][4]*wsf,3);
                   htmlData+="<p><b>Pnet30 Center = </b><em> "+p30Cen+" psf</em></p>"; 
                   htmlData+="<p><b>Pnet30 Corner = </b><em> "+p30Corn+" psf</em></p><br />";                     
                   	if(isNum(iFactor)){
	                	 pnetcen=roundTo(h*iFactor*p30Cen,3);
		                 pnetcorn=roundTo(h*iFactor*p30Corn,3);
                         htmlData+="<p><b>Pnet Center = </b><em class='answ'> "+pnetcen+" psf</em></p>";
                         htmlData+="<p><b>Pnet Corner = </b><em class='answ'> "+pnetcorn+" psf</em></p>";   		                 
	                }  
                }
        }
    }else if( rHeight <= 400 ){ // use UBC_97 data
        // no exposure A data available from UBC97
        if( pos == 0 ){
            htmlData+="<br /><p><strong>Note: Exposure A data unavailable above 60', exposure B data will be used.</strong></p><br />";
            pos++;
        }
        // getting h
        var gLen = UBC9716G.length;
        var ptr = 0;
        while( UBC9716G[ ptr ][0] < rHeight && ptr < gLen )
            ptr++;    
        var h = UBC9716G[ ptr ][++pos];
        htmlData+="<p><b>Height Factor = </b><em> "+h+"</em><br /><br />";	
        // getting Qs (wind stagnation pressure)
        gLen = UBC9716F.length;
        ptr = 0;
        while( UBC9716F[ ptr ][0] < windSpd && ptr < gLen )
            ptr++;
        var Qs = UBC9716F[ ptr ][ 1 ];
        htmlData+="<p><b>Wind Stagnation Pressure = </b><em> "+Qs+"</em><br />";
        // getting Cqtyp and Cqcorner
        gLen = UBC9716H.length;
        ptr = 0;        
        while( UBC9716H[ ptr ][0] < eArea && ptr < gLen )	
            ptr++;
        CQTyp = UBC9716H[ ptr ][1];
        CQCorn = UBC9716H[ ptr ][2];
        htmlData+="<p><b>Cq Typical = </b><em> "+CQTyp+"</em>";
        htmlData+="<p><b>Cq Corner = </b><em> "+CQCorn+"</em><br /><br />";
        var PTyp = -roundTo( h * iFactor * Qs * CQTyp, 3);
        var PCorn = -roundTo( h * iFactor * Qs * CQCorn, 3);
        htmlData+="<p><b>Pnet Center = </b><em class='answ'> "+PTyp+" psf</em></p>";
        htmlData+="<p><b>Pnet Corner = </b><em class='answ'> "+PCorn+" psf</em></p>";           
    }else{
        htmlData+="<br /><p><strong>Note: This calculator does not contain data for buildings higher than 400'.</strong></p><br />";
    }
    document.getElementById(divId).innerHTML=htmlData;
}

function roundTo(n,decPlace){
        return Math.round(n*Math.pow(10,decPlace))/Math.pow(10,decPlace);
}

function isNum(num){
    return !isNaN(num);
}

function arIndexOf( needle, haystack ){
	for( i in haystack ){
		if( haystack[i] == needle )
		return i;
	}
	return false;
}

function findGreatest(needle,haystack,offset){
		for(i=0;i<haystack.length;i++){
			if(needle>=haystack[i][offset]) return i;
		}
		return haystack[haystack.length-1];
}
