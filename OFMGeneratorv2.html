<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NENC OFM Generator — Northshore Exteriors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── NF Palette ── */
:root {
  --nf-cream:#FAF7F0; --nf-linen:#F0EAD8; --nf-raw-cotton:#DDD5C0;
  --nf-undyed-wool:#C6B99F; --nf-sand:#B0A088; --nf-jute:#8C7A62;
  --nf-bark:#5E4B38; --nf-espresso:#2E2118;
  --nf-moss:#6A7A58; --nf-moss-light:#D4DBC8;
  --nf-clay:#9C6448; --nf-clay-light:#E8CDBF;
  --nf-slate:#7A7870; --nf-slate-light:#DDDAD4;
  --font-display:'Cormorant Garamond',Georgia,serif;
  --font-body:'Jost',sans-serif;
  --font-mono:'DM Mono',monospace;
  --radius-sm:2px; --radius-md:6px; --radius-lg:12px; --radius-pill:999px;
  --border-subtle:1px solid rgba(94,75,56,0.15);
  --border-mid:1px solid rgba(94,75,56,0.30);
  --border-strong:1px solid rgba(94,75,56,0.55);
  --shadow-soft:0 2px 12px rgba(46,33,24,0.08);
  --shadow-lift:0 6px 24px rgba(46,33,24,0.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:15px;}
body{background:var(--nf-cream);color:var(--nf-espresso);font-family:var(--font-body);font-weight:300;line-height:1.6;}

/* ── App Shell ── */
.app-shell{display:flex;flex-direction:column;min-height:100vh;}
.app-header{background:var(--nf-espresso);color:var(--nf-cream);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px;flex-shrink:0;}
.app-header-brand{font-family:var(--font-display);font-size:22px;font-weight:300;letter-spacing:0.02em;}
.app-header-brand span{color:var(--nf-undyed-wool);font-size:12px;font-family:var(--font-mono);font-weight:300;letter-spacing:0.15em;margin-left:16px;text-transform:uppercase;}
.app-header-right{font-family:var(--font-mono);font-size:11px;color:var(--nf-sand);letter-spacing:0.12em;}
.stage-nav{background:var(--nf-bark);display:flex;overflow-x:auto;padding:0 32px;flex-shrink:0;}
.stage-tab{font-family:var(--font-mono);font-size:10px;font-weight:400;letter-spacing:0.14em;text-transform:uppercase;color:var(--nf-undyed-wool);padding:14px 18px;cursor:pointer;border:none;background:none;white-space:nowrap;border-bottom:2px solid transparent;transition:all 0.18s;}
.stage-tab:hover{color:var(--nf-cream);}
.stage-tab.active{color:var(--nf-cream);border-bottom-color:var(--nf-clay);}
.stage-tab.completed{color:var(--nf-moss-light);}
.stage-num{font-size:9px;opacity:0.6;margin-right:6px;}
.stage-content{flex:1;padding:40px 48px;max-width:1400px;width:100%;margin:0 auto;}
.stage-title{font-family:var(--font-display);font-size:36px;font-weight:300;color:var(--nf-bark);margin-bottom:6px;}
.stage-subtitle{font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--nf-sand);margin-bottom:32px;}

/* ── Forms ── */
.field-group{margin-bottom:20px;}
.field-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--nf-sand);margin-bottom:6px;display:block;}
.nf-input{font-family:var(--font-body);font-size:14px;font-weight:300;color:var(--nf-espresso);background:var(--nf-cream);border:var(--border-mid);border-radius:var(--radius-md);padding:9px 14px;width:100%;outline:none;transition:border-color 0.18s;}
.nf-input:focus{border-color:var(--nf-jute);}
.nf-input::placeholder{color:var(--nf-undyed-wool);}
.nf-input[readonly]{background:var(--nf-linen);color:var(--nf-slate);}
.nf-select{font-family:var(--font-body);font-size:13px;font-weight:300;color:var(--nf-espresso);background:var(--nf-cream);border:var(--border-mid);border-radius:var(--radius-md);padding:8px 12px;outline:none;cursor:pointer;width:100%;}
.nf-select:focus{border-color:var(--nf-jute);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 32px;}
.form-grid-full{grid-column:1/-1;}

/* ── Buttons ── */
.btn{font-family:var(--font-body);font-size:13px;font-weight:400;letter-spacing:0.03em;padding:9px 20px;border-radius:var(--radius-md);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 0.18s;border:none;line-height:1;}
.btn-primary{background:var(--nf-bark);color:var(--nf-cream);}
.btn-primary:hover{background:var(--nf-espresso);}
.btn-secondary{background:transparent;color:var(--nf-bark);border:var(--border-strong);}
.btn-secondary:hover{background:var(--nf-raw-cotton);}
.btn-ghost{background:transparent;color:var(--nf-jute);border:var(--border-subtle);}
.btn-ghost:hover{color:var(--nf-bark);}
.btn-danger{background:transparent;color:#9C4848;border:1px solid rgba(156,72,72,0.35);}
.btn-danger:hover{background:rgba(156,72,72,0.07);}
.btn-moss{background:var(--nf-moss);color:var(--nf-cream);}
.btn-moss:hover{background:#5a6a48;}
.btn-sm{padding:5px 12px;font-size:12px;}
.btn-xs{padding:3px 8px;font-size:11px;}

/* ── Tables ── */
.nf-table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:var(--border-subtle);box-shadow:var(--shadow-soft);}
.nf-table{width:100%;border-collapse:collapse;font-size:13px;}
.nf-table th{font-family:var(--font-mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--nf-sand);background:var(--nf-linen);padding:10px 12px;text-align:left;border-bottom:var(--border-mid);white-space:nowrap;}
.nf-table td{padding:8px 12px;border-bottom:var(--border-subtle);vertical-align:middle;}
.nf-table tr:last-child td{border-bottom:none;}
.nf-table tr:hover td{background:rgba(240,234,216,0.4);}
.td-mono{font-family:var(--font-mono);font-size:12px;color:var(--nf-slate);}
.td-num{text-align:right;font-family:var(--font-mono);font-size:12px;}
.td-input{width:100%;font-family:var(--font-body);font-size:13px;font-weight:300;color:var(--nf-espresso);background:transparent;border:1px solid transparent;border-radius:var(--radius-sm);padding:4px 6px;outline:none;transition:border-color 0.15s;}
.td-input:focus{border-color:var(--nf-undyed-wool);background:var(--nf-cream);}
.td-input[readonly]{color:var(--nf-slate);cursor:default;}
.nf-card{background:var(--nf-cream);border:var(--border-subtle);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-soft);}
.section-divider{border:none;border-top:var(--border-subtle);margin:24px 0;}
.tag{font-family:var(--font-body);font-size:11px;padding:2px 9px;border-radius:var(--radius-pill);display:inline-block;}
.tag-unit{background:var(--nf-clay-light);color:var(--nf-clay);border:1px solid rgba(156,100,72,0.25);}
.tag-lf{background:var(--nf-moss-light);color:var(--nf-moss);border:1px solid rgba(106,122,88,0.25);}
.upload-zone{border:2px dashed var(--nf-undyed-wool);border-radius:var(--radius-lg);padding:40px 32px;text-align:center;cursor:pointer;transition:all 0.18s;background:var(--nf-linen);}
.upload-zone:hover{border-color:var(--nf-jute);background:var(--nf-raw-cotton);}
.upload-zone input[type=file]{display:none;}
.split-view{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.panel-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--nf-sand);margin-bottom:10px;}
.alert{padding:12px 16px;border-radius:var(--radius-md);font-size:13px;margin-bottom:16px;display:flex;align-items:start;gap:10px;}
.alert-info{background:rgba(212,219,200,0.4);border:1px solid rgba(106,122,88,0.3);color:var(--nf-moss);}
.alert-warn{background:rgba(232,205,191,0.4);border:1px solid rgba(156,100,72,0.3);color:var(--nf-clay);}

/* ── Stage 5 Detail Assignment ── */
.s5-layout{display:grid;grid-template-columns:1fr 260px;gap:28px;align-items:start;}
.s5-detail-list{display:flex;flex-direction:column;gap:8px;}
.s5-detail-card{background:var(--nf-cream);border:var(--border-subtle);border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow-soft);}
.s5-detail-hdr{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.s5-detail-name{font-family:var(--font-mono);font-size:13px;font-weight:400;color:var(--nf-bark);}
.s5-detail-meas{font-family:var(--font-mono);font-size:12px;color:var(--nf-slate);}
.s5-slots{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
.s5-slot{background:var(--nf-linen);border:var(--border-subtle);border-radius:var(--radius-sm);padding:8px 10px;min-width:160px;position:relative;}
.s5-slot-select{width:100%;font-family:var(--font-mono);font-size:12px;background:var(--nf-cream);border:var(--border-mid);border-radius:var(--radius-sm);padding:4px 6px;color:var(--nf-espresso);outline:none;margin-bottom:4px;}
.s5-slot-meta{font-family:var(--font-mono);font-size:10px;color:var(--nf-jute);line-height:1.7;}
.s5-slot-calcs{font-family:var(--font-mono);font-size:10px;color:var(--nf-slate);margin-top:2px;}
.s5-slot-remove{position:absolute;top:4px;right:4px;background:none;border:none;cursor:pointer;color:var(--nf-sand);font-size:12px;line-height:1;padding:2px 4px;}
.s5-slot-remove:hover{color:#9C4848;}
.mat-summary{background:var(--nf-linen);border:var(--border-subtle);border-radius:var(--radius-lg);padding:18px;position:sticky;top:20px;}
.mat-summary-title{font-family:var(--font-display);font-size:17px;font-weight:400;color:var(--nf-bark);margin-bottom:12px;}
.mat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:var(--border-subtle);}
.mat-row:last-child{border-bottom:none;}
.mat-sheets{font-family:var(--font-mono);font-size:14px;color:var(--nf-clay);}
.mat-sub{font-family:var(--font-mono);font-size:10px;color:var(--nf-sand);}

/* ── Stage 6 Screen View ── */
.ofm-screen-cards{display:grid;gap:24px;}
.ofm-screen-card{background:#fff;border:var(--border-mid);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-lift);}
.ofm-screen-card-hdr{background:var(--nf-bark);color:var(--nf-cream);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;}
.ofm-screen-part-id{font-family:var(--font-display);font-size:24px;font-weight:600;letter-spacing:0.04em;}
.ofm-screen-card-body{padding:20px;}
.ofm-screen-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;}
.ofm-screen-field label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--nf-sand);display:block;margin-bottom:4px;}
.ofm-screen-val{font-size:13px;color:var(--nf-espresso);}
.ofm-screen-input{font-family:var(--font-body);font-size:13px;color:var(--nf-espresso);background:var(--nf-linen);border:var(--border-mid);border-radius:var(--radius-sm);padding:6px 10px;width:100%;outline:none;}
.ofm-screen-input:focus{border-color:var(--nf-jute);}
.notch-bar{background:var(--nf-linen);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
.notch-bar-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--nf-sand);}
.notch-chk{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;}
.notch-chk input{accent-color:var(--nf-bark);width:14px;height:14px;cursor:pointer;}
.notch-num{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--nf-jute);}
.notch-num input{width:60px;font-family:var(--font-mono);font-size:12px;background:var(--nf-cream);border:var(--border-mid);border-radius:var(--radius-sm);padding:3px 7px;outline:none;}

/* ── Save/Load ── */
.save-load-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
.sp-panel{background:var(--nf-linen);border:var(--border-subtle);border-radius:var(--radius-lg);padding:22px;}
.sp-panel-title{font-family:var(--font-display);font-size:18px;font-weight:400;color:var(--nf-bark);margin-bottom:14px;}
.auth-row{display:flex;align-items:center;gap:10px;margin-top:12px;}
.auth-dot{width:8px;height:8px;border-radius:50%;}
.auth-dot.ok{background:var(--nf-moss);}
.auth-dot.no{background:var(--nf-clay);}

/* ═══════════════════════════════════
   OFM PRINT SHEET  (matches image)
═══════════════════════════════════ */
.ofm-print-root{background:white;}
.ofm-print-page{
  background:white;
  font-family:Arial,Helvetica,sans-serif;
  font-size:11px;
  color:#000;
  break-after:page;
  page-break-after:always;
  border:2px solid #444;
  display:flex;
  flex-direction:column;
}
@media screen{
  .ofm-print-root{padding:32px;max-width:880px;margin:0 auto;}
  .ofm-print-page{margin-bottom:40px;box-shadow:0 4px 24px rgba(0,0,0,0.12);}
}
/* Header table */
.ofm-hdr-table{width:100%;border-collapse:collapse;border-bottom:1.5px solid #555;}
.ofm-logo-cell{
  background:#165E7A;
  color:#fff;
  font-weight:900;
  font-size:14px;
  letter-spacing:0.06em;
  text-align:center;
  padding:10px 8px;
  border-right:1.5px solid #555;
  width:130px;
}
.ofm-hdr-title-cell{
  font-size:14px;
  font-weight:700;
  text-align:center;
  padding:6px 10px;
  vertical-align:middle;
}
.ofm-hdr-date-cell{padding:6px 8px;white-space:nowrap;vertical-align:middle;}
.ofm-hdr-page-cell{padding:6px 10px;text-align:right;white-space:nowrap;vertical-align:middle;}
.ofm-hdr-info-cell{padding:3px 10px;vertical-align:middle;}
.ofm-hdr-val{border-bottom:1px solid #aaa;display:inline-block;min-width:180px;padding-bottom:1px;}
.ofm-hdr-right{text-align:right;}
/* Body info section */
.ofm-body-table{width:100%;border-collapse:collapse;border-bottom:1.5px solid #555;}
.ofm-body-table td{padding:5px 10px;border:none;vertical-align:middle;}
.ofm-material-cell{border-bottom:1px solid #ccc;border-right:1.5px solid #555;}
.ofm-material-val{border-bottom:1px solid #aaa;display:inline-block;min-width:340px;}
.ofm-partnum-cell{
  border-left:1.5px solid #555;
  text-align:center;
  vertical-align:middle;
  padding:0;
}
.ofm-partnum-header{
  background:#165E7A;
  color:#fff;
  font-size:10px;
  font-weight:700;
  letter-spacing:0.12em;
  text-align:center;
  padding:5px;
  border-bottom:1px solid #ddd;
}
.ofm-partnum-value{
  font-size:38px;
  font-weight:900;
  color:#000;
  display:block;
  text-align:center;
  padding:8px 12px;
}
.ofm-mfg-cell{border-right:1px solid #ccc;border-bottom:1px solid #ccc;border-right:1.5px solid #555;}
.ofm-qty-cell{border-bottom:1px solid #ccc;border-right:1.5px solid #555;}
.ofm-notch-cell{padding:6px 10px;border-right:1.5px solid #555;}
.notch-print-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:11px;}
.notch-print-chk{display:inline-flex;align-items:center;gap:4px;}
.notch-box{
  width:14px;height:14px;border:1.5px solid #444;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;vertical-align:middle;
}
.notch-box.checked{background:#FFE066;border-color:#888;}
.notch-box.checked::after{content:'✓';}
.notch-input-line{border:none;border-bottom:1px solid #555;width:48px;background:transparent;font-size:11px;text-align:center;outline:none;}
/* Main body */
.ofm-main-area{display:flex;flex:1;min-height:320px;border-top:1px solid #ccc;}
.ofm-drawing-area{
  flex:3;
  border-right:1.5px solid #555;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ccc;
  font-size:10px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  flex-direction:column;
  gap:8px;
  padding:16px;
}
.ofm-zone-col{flex:1;min-width:130px;display:flex;flex-direction:column;}
.ofm-zone-tbl{width:100%;border-collapse:collapse;flex:1;}
.ofm-zone-tbl th{background:#e8e8e8;padding:4px 6px;text-align:center;border-bottom:1px solid #999;font-size:10px;font-weight:700;}
.ofm-zone-tbl th:first-child{border-right:1px solid #ccc;}
.ofm-zone-tbl td{padding:3px 6px;text-align:center;border-bottom:1px solid #eee;font-size:10px;color:#165E7A;}
.ofm-zone-tbl td:first-child{border-right:1px solid #eee;}
.ofm-zone-tbl tfoot td{background:#eee;font-weight:700;border-top:1px solid #999;font-size:10px;}
/* Detail breakdown */
.ofm-detail-section{border-top:1px solid #ddd;padding:6px 10px;}
.ofm-detail-tbl{width:100%;border-collapse:collapse;font-size:10px;}
.ofm-detail-tbl th{background:#f5f5f5;padding:3px 8px;text-align:left;border-bottom:1px solid #ccc;font-weight:700;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;}
.ofm-detail-tbl td{padding:2px 8px;border-bottom:1px solid #f0f0f0;color:#165E7A;}
/* Footer */
.ofm-sheet-footer{
  border-top:1.5px solid #555;
  padding:8px 10px;
  text-align:center;
  font-size:13px;
  font-weight:700;
}

/* ── Summary/Assignments print pages ── */
.print-summary-page{
  background:white;
  font-family:Arial,Helvetica,sans-serif;
  font-size:11px;
  color:#000;
  break-after:page;
  page-break-after:always;
  border:2px solid #444;
  padding:24px;
}
@media screen{
  .print-summary-page{margin-bottom:40px;box-shadow:0 4px 24px rgba(0,0,0,0.12);}
}
.print-page-title{font-size:16px;font-weight:700;margin-bottom:16px;border-bottom:2px solid #165E7A;padding-bottom:6px;color:#165E7A;}
.print-tbl{width:100%;border-collapse:collapse;font-size:11px;}
.print-tbl th{background:#165E7A;color:white;padding:5px 10px;text-align:left;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;}
.print-tbl td{padding:4px 10px;border-bottom:1px solid #eee;}
.print-tbl tr:nth-child(even) td{background:#f8f8f8;}
.print-tbl tfoot td{background:#e8e8e8;font-weight:700;border-top:1px solid #999;}

/* ── @media print ── */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  body{margin:0;padding:0;background:white;}
  .ofm-print-root{padding:0;}
}

/* ── Responsive ── */
@media(max-width:900px){
  .s5-layout,.split-view,.save-load-grid,.form-grid{grid-template-columns:1fr;}
  .stage-content{padding:24px 16px;}
  .ofm-screen-row{grid-template-columns:1fr 1fr;}
}
/* ── Drawing Canvas ── */
.draw-wrap{margin-top:12px;border-top:var(--border-subtle);padding-top:10px;}
.draw-toolbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:7px 10px;background:var(--nf-linen);border-radius:var(--radius-md);border:var(--border-subtle);margin-bottom:6px;}
.draw-sep{width:1px;height:18px;background:var(--nf-raw-cotton);margin:0 3px;flex-shrink:0;}
.draw-canvas-row{display:flex;gap:8px;align-items:flex-start;}
.draw-marks{width:120px;flex-shrink:0;display:flex;flex-direction:column;gap:3px;}
.draw-mark-item{display:flex;justify-content:space-between;align-items:center;padding:3px 6px;border-radius:var(--radius-sm);cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--nf-jute);text-transform:uppercase;border:1px solid transparent;}
.draw-mark-item.sel{background:var(--nf-linen);border-color:var(--nf-undyed-wool);}
.draw-mark-item button{background:none;border:none;cursor:pointer;color:var(--nf-sand);font-size:11px;padding:0 2px;line-height:1;}
.draw-mark-item button:hover{color:#9C4848;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

/* ─── HELPERS ──────────────────────────────── */
const lsGet = (k,d) => { try { const v = localStorage.getItem(k); return v!==null ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const mathCeil  = (v,f) => f > 0 ? Math.ceil(v/f)*f : v;
const roundUp   = v => Math.ceil(v);
const roundDown = v => Math.floor(v);
const genId     = () => Math.random().toString(36).slice(2,9).toUpperCase();

function parseCSV(text) {
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,'').toLowerCase().trim());
  return lines.slice(1).map(line => {
    const vals = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') { inQ = !inQ; }
      else if (line[i] === ',' && !inQ) { vals.push(cur.trim()); cur = ''; }
      else { cur += line[i]; }
    }
    vals.push(cur.trim());
    const row = {};
    headers.forEach((h,i) => { row[h] = (vals[i]||'').replace(/^"|"$/g,''); });
    return row;
  }).filter(r => Object.values(r).some(v=>v.trim()));
}

function computePivot(rawRows, rounding) {
  const map = {};
  rawRows.forEach(r => {
    const detail  = (r.detail || '').trim();
    const area    = (r.area   || '').trim();
    const meas    = parseFloat(r.measurement || 0) || 0;
    const count   = parseInt(r.count || 0) || 0;
    if (!detail) return;
    if (!map[detail]) map[detail] = { detail, measurement:0, count:0, areas:new Set() };
    if (count > 0) {
      map[detail].count += count;
    } else {
      map[detail].measurement += mathCeil(meas, rounding||10);
    }
    if (area) map[detail].areas.add(area);
  });
  return Object.values(map).map(r => ({
    detail: r.detail,
    measurement: r.measurement,
    count: r.count,
    isUnit: r.count > 0,
    areas: [...r.areas],
  })).sort((a,b) => a.detail.localeCompare(b.detail, undefined, {numeric:true}));
}

function computeSticks(da, material, part) {
  if (!material || !part) return {sticks:0,pps:0,sheets:0};
  const length = parseFloat(material.length) || 1;
  const width  = parseFloat(material.width)  || 0;
  const so     = parseFloat(part.stretchout) || 1;
  const sticks = da.isUnit ? (da.count || 1) : roundUp((da.measurement||0) / length);
  const pps    = roundDown((width * 12) / so);
  const sheets = pps > 0 ? roundUp(sticks / pps) : 0;
  return {sticks, pps, sheets};
}

// Compute OFM by Area from raw bluebeam + assignments (matches VBA logic)
function computeOFMbyArea(bluebeamData, detailAssignments, settings) {
  const map = {};
  bluebeamData.forEach(r => {
    const area   = (r.area   || '').trim();
    const detail = (r.detail || '').trim();
    const meas   = parseFloat(r.measurement || 0) || 0;
    const count  = parseInt(r.count || 0) || 0;
    const rounded = count > 0 ? count : mathCeil(meas, settings.materialRounding || 10);
    const da = detailAssignments.find(d => d.detail === detail);
    if (!da) return;
    da.ofms.forEach(slot => {
      if (!slot.ofmId) return;
      const key = `${slot.ofmId}|||${area}`;
      map[key] = (map[key]||0) + rounded;
    });
  });
  return Object.entries(map).map(([key,total]) => {
    const [ofmId, area] = key.split('|||');
    return {ofmId, area, total};
  }).sort((a,b) => a.ofmId.localeCompare(b.ofmId) || a.area.localeCompare(b.area, undefined, {numeric:true}));
}

function getNoteVal(notes, field) {
  if (field === 'notch4' && notes[field] === undefined) return true;
  return notes[field] ?? (field === 'notch4' ? true : '');
}

  const right= getNoteVal(notes,'right');

      </span>
      <span className="notch-print-chk">
        <span className={`notch-box${none?' checked':''}`}></span> None

}

            </td>
          </tr>

      </table>

      {/* ── Body Info ── */}
      <table className="ofm-body-table">
        <colgroup>
          <col style={{width:'35%'}} />
          <col style={{width:'35%'}} />
          <col style={{width:130}} />
        </colgroup>
        <tbody>
          <tr>
            <td className="ofm-material-cell" colSpan={2} style={{padding:'5px 10px'}}>

              {zones.map((z,i) => (
                <tr key={i}>

      <table className="print-tbl">
        <thead>
          <tr><th>OFM Part</th><th>Description</th><th>Area / Zone</th><th style={{textAlign:'right'}}>Total LF / Qty</th></tr>
        </thead>
        <tbody>
          {rows.map((r,i) => (
            <tr key={i}>
              <td><strong>{r.ofmId}</strong></td>
              <td>{getName(r.ofmId)}</td>

function PrintAssignmentsPage({ state }) {
  const { detailAssignments, ofmParts, job } = state;
  const sorted = useMemo(() =>
    [...detailAssignments].sort((a,b) =>
      a.detail.localeCompare(b.detail, undefined, {numeric:true})),
    [detailAssignments]
  );
  const getPartName = id => { const p = ofmParts.find(p=>p.id===id); return p ? p.id : ''; };
  return (
    <div className="print-summary-page">
      <div style={{marginBottom:8,fontSize:11,color:'#555'}}>
        {job.jobName} · #{job.jobNumber} · {job.date}
      </div>
      <div className="print-page-title">OFM Detail Assignments</div>
      <table className="print-tbl">
        <thead>
          <tr>
            <th>Detail</th>
            <th>Measurement</th>
            <th>Type</th>
            <th>OFM Parts Assigned</th>
          </tr>
        </thead>

          {sorted.map((da,i) => {
            const assigned = da.ofms.filter(s=>s.ofmId).map(s=>s.ofmId);
            return (
              <tr key={i}>
                <td><strong>{da.detail}</strong></td>
                <td>{da.isUnit ? `${da.count} ea` : `${da.measurement} LF`}</td>

}

function PrintRoot({ state, printTarget }) {
  const { ofmParts, detailAssignments, materials, job, ofmSheetNotes, bluebeamData, settings } = state;

  const ofmAreaData = useMemo(() =>
    computeOFMbyArea(bluebeamData, detailAssignments, settings),
    [bluebeamData, detailAssignments, settings]
  );

  const buildSheets = () => {
    return ofmParts.map((part, idx) => {
      const mat = materials.find(m => m.id === part.materialId) || null;
      const zones = ofmAreaData.filter(r => r.ofmId === part.id);
      const details = detailAssignments.filter(da =>
        da.ofms.some(s => s.ofmId === part.id)
      );
      const notes = ofmSheetNotes[part.id] || {};
      return { part, mat, zones, details, notes, pageNum: idx+1 };
    });
  };

  const sheets = buildSheets();
  const totalOFMPages = ofmParts.length;

  if (printTarget === 'summary') {
    return (
      <div className="ofm-print-root">
        <PrintSummaryPage state={state} />
        <PrintAssignmentsPage state={state} />
      </div>
    );
  }

  if (printTarget && printTarget !== 'all') {
    // single card
    const sh = sheets.find(s => s.part.id === printTarget);
    if (!sh) return <div>Part not found</div>;
    return (
      <div className="ofm-print-root">
        <PrintOFMCard {...sh} totalPages={totalOFMPages}
          job={job} manufacture={sh.notes.manufacture||''} />
      </div>
    );
  }

  // 'all'
  return (
    <div className="ofm-print-root">
      <PrintSummaryPage state={state} />
      <PrintAssignmentsPage state={state} />
      {sheets.map(sh => (
        <PrintOFMCard key={sh.part.id} {...sh} totalPages={totalOFMPages}
          job={job} manufacture={sh.notes.manufacture||''} />
      ))}
    </div>
  );
}

/* ═══════════════════════════════════════════════
   STAGE 1 — JOB SETUP
═══════════════════════════════════════════════ */

  const { job, settings } = state;
  const setJob = (k,v) => setState(s=>({...s, job:{...s.job,[k]:v}}));
